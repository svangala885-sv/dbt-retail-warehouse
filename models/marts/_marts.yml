version: 2

models:
  - name: dim_customers
    description: SCD Type 2 customer dimension. valid_to is null for the current version.
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: state
        tests: [not_null]

  - name: dim_products
    columns:
      - name: product_sk
        tests: [unique, not_null]
      - name: product_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fct_order_items
    description: Order-line fact with point-in-time customer key.
    columns:
      - name: order_item_sk
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_sk
              config:
                where: "customer_sk != '-1'"
      - name: product_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_sk
      - name: line_amount
        tests: [positive_value]

  - name: agg_monthly_revenue
    description: Revenue (completed and shipped orders) by month, customer state at order time, and category.
